<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Engineering Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="frame">
    <a class="back" href="index.html">← all versions</a>
    <header>
      <div class="eyebrow" id="page-eyebrow"></div>
      <h1 id="page-heading"></h1>
      <div class="stack" id="page-tags"></div>
    </header>
    <div id="page-content"></div>
    <div class="next" id="page-nav"></div>
  </div>

  <nav class="toc" id="page-toc"></nav>

  <script type="module">
    // URL에서 버전 읽기 (?v=1.0 또는 파일명에서)
    const params = new URLSearchParams(location.search);
    let ver = params.get('v');
    if (!ver) {
      // 파일명에서 추출 (v1.0.html → 1.0)
      ver = location.pathname.match(/v([\d.]+)\.html/)?.[1];
    }

    if (ver) {
      import(`./versions/v${ver}.js`).then(mod => {
        const page = mod.default;
        render(page);
      });
    }

    async function render(page) {
      document.title = `${page.version} — ${page.title}`;
      document.getElementById('page-eyebrow').textContent = page.version;
      document.getElementById('page-heading').textContent = page.title;

      // 태그
      const tagEl = document.getElementById('page-tags');
      tagEl.innerHTML = page.tags.map(t =>
        `<span class="chip"><span class="ic"></span>${t}</span>`
      ).join('');

      // 본문
      document.getElementById('page-content').innerHTML = page.sections.join('\n');

      // 네비게이션
      const nav = document.getElementById('page-nav');
      let navHTML = '';
      if (page.prev) {
        const prevTitle = (await import(`./versions/v${page.prev}.js`)).default.title;
        navHTML += `<a href="template.html?v=${page.prev}" class="next-btn">prev<b>v${page.prev}</b><span class="next-btn-title">${prevTitle}</span></a>`;
      }
      if (page.next) {
        const nextTitle = (await import(`./versions/v${page.next}.js`)).default.title;
        navHTML += `<a href="template.html?v=${page.next}" class="next-btn next-btn-next">next up<b>v${page.next}</b><span class="next-btn-title">${nextTitle}</span></a>`;
      }
      nav.innerHTML = navHTML;

      buildTOC();
    }

    // 우측 고정 목차 (섹션 이동 + 스크롤 위치에 따른 활성 표시)
    function buildTOC() {
      const toc = document.getElementById('page-toc');
      const sections = [...document.querySelectorAll('#page-content section')];

      if (!sections.length) {
        toc.innerHTML = '';
        return;
      }

      toc.innerHTML = sections.map(sec => {
        const num = sec.querySelector('.num')?.textContent ?? '';
        const title = sec.querySelector('.sec-title')?.textContent ?? '';
        return `<a href="#${sec.id}" class="toc-item" data-target="${sec.id}"><span class="toc-num">${num}</span><span class="toc-label">${title}</span></a>`;
      }).join('');

      const links = [...toc.querySelectorAll('.toc-item')];
      const setActive = id => {
        links.forEach(l => l.classList.toggle('active', l.dataset.target === id));
      };
      setActive(sections[0].id);

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) setActive(entry.target.id);
        });
      }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
      sections.forEach(sec => observer.observe(sec));
    }

    // 이미지 라이트박스 (클릭 시 확대, 다시 클릭 시 원상태)
    const lightbox = document.createElement('div');
    lightbox.className = 'lightbox-overlay';
    const lightboxImg = document.createElement('img');
    lightbox.appendChild(lightboxImg);
    document.body.appendChild(lightbox);

    document.getElementById('page-content').addEventListener('click', e => {
      const img = e.target.closest('.placeholder.has-image img');
      if (!img) return;
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
    });
    lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') lightbox.classList.remove('open');
    });
  </script>
</body>
</html>
