<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Bottleneck Experiments</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F6F2;
    --grid:#C9D6E3;
    --ink:#1B2430;
    --ink-soft:#5B6675;
    --accent:#FF5A1F;
    --blue:#3B6EF0;
    --line:#D7D2C5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      linear-gradient(rgba(201,214,227,.45) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(201,214,227,.45) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--paper);
    background-attachment: fixed;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }

  .frame{
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 24px 120px;
    position: relative;
  }

  header{
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 8px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow: 0 0 0 3px rgba(255,90,31,.18);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse{ 50%{opacity:.4;} }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 34px;
    letter-spacing: -0.01em;
  }
  .nav-grid{
    display:grid;
    gap: 16px;
    margin-top: 40px;
  }
  .nav-card{
    position: relative;
    display:block;
    padding: 24px 26px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: rgba(255,255,255,.5);
    text-decoration:none;
    color:inherit;
    transition: border-color .15s, padding-left .18s ease;
  }
  .nav-card:hover{
    border-color: var(--accent);
    padding-left: 34px;
  }
  .nav-card:hover .nav-title{ color: var(--accent); }
  .nav-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing:.06em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .nav-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 20px;
    margin-top: 6px;
    transition: color .15s;
  }
  .nav-desc{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-top: 8px;
    max-width: 480px;
  }
  .nav-arrow{
    position:absolute;
    right: 26px; top: 50%;
    transform: translateY(-50%);
    font-family:'JetBrains Mono', monospace;
    color: var(--ink-soft);
    font-size: 18px;
  }

  footer{
    margin-top: 64px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    border-top: 1px dashed var(--line);
    padding-top: 18px;
  }
</style>
</head>
<body>

  <div class="frame">
    <header>
      <div class="eyebrow"><span class="dot"></span>cloud-portfolio</div>
      <h1>부하 테스트를 통한 인프라 개선</h1>
    </header>

    <div class="nav-grid">

      <a class="nav-card" href="log.html">
        <div class="nav-label">engineering log</div>
        <div class="nav-title">아키텍처 변경 기록</div>
        <div class="nav-desc">버전(v1.0 ~ v5.1)마다 무엇을 바꿨고, 왜 그렇게 판단했는지를 그대로 남긴 기록입니다.</div>
        <div class="nav-arrow">→</div>
      </a>

      <a class="nav-card" href="diagrams.html">
        <div class="nav-label">visual history</div>
        <div class="nav-title">아키텍처 변화</div>
        <div class="nav-desc">텍스트 없이 다이어그램만으로 아키텍처가 어떻게 바뀌어왔는지 훑어봅니다.</div>
        <div class="nav-arrow">→</div>
      </a>

      <a class="nav-card" href="results.html">
        <div class="nav-label">final verification</div>
        <div class="nav-title">최종 실험 결과</div>
        <div class="nav-desc">최종 버전(v5.1)의 Soak Test 및 점진적 부하 테스트 결과입니다.</div>
        <div class="nav-arrow">→</div>
      </a>

    </div>

  </div>
</body>
</html>
